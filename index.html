<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tastatura Virtuala CV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
  body { background: #0f1117; color: white; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  #video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.35; z-index: 0; }
  #ui { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; padding: 8px; gap: 6px; }
  #display { background: rgba(30, 34, 45, 0.92); border: 2px solid #00dcb4; border-radius: 12px; padding: 12px; font-size: 24px; min-height: 58px; display: flex; align-items: center; word-break: break-all; }
  .row { display: flex; gap: 4px; flex: 1; justify-content: center; }
  .key { background: rgba(55, 62, 75, 0.92); border: 1px solid #788296; border-radius: 10px; flex: 1; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; text-align: center; user-select: none; }
  .key.active { background: #00b862; border: 2px solid #ffffff; transform: scale(1.04); }
  .key.special { background: #006eb4; flex: 1.6; font-size: 13px; }
  .key.danger { background: #9e2a2b; flex: 1.6; font-size: 13px; }
  .key.calib { background: #9c6615; flex: 1.6; font-size: 12px; }
  .key.sug { background: #285873; flex: 1.5; font-size: 13px; }
  #cursor { position: fixed; width: 28px; height: 28px; border-radius: 50%; background: #00ffb4; border: 3px solid white; pointer-events: none; z-index: 10; transform: translate(-50%, -50%); box-shadow: 0 0 15px #00ffb4; }
  #ring { position: fixed; width: 58px; height: 58px; border-radius: 50%; border: 4px solid transparent; pointer-events: none; z-index: 9; transform: translate(-50%, -50%); }
  #nose-dot { position: fixed; width: 10px; height: 10px; border-radius: 50%; background: #ff3b30; pointer-events: none; z-index: 2; transform: translate(-50%, -50%); }
  #status-bar { position: fixed; top: 4px; right: 10px; font-size: 11px; color: #00dcb4; z-index: 15; }
</style>
</head>
<body>
<video id="video-bg" autoplay playsinline muted></video>
<div id="nose-dot"></div>
<div id="cursor"></div>
<div id="ring"></div>
<div id="status-bar">Incarcare AI...</div>
<div id="ui">
  <div id="display"><span id="text"></span><span style="color:#00dcb4">|</span></div>
  <div class="row" id="row-top"></div>
  <div class="row" id="row-1"></div>
  <div class="row" id="row-2"></div>
  <div class="row" id="row-3"></div>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://jsdelivr.net";

const dict = ["SALUT","BUNA","MULTUMESC","AJUTOR","APA","MANCARE","DA","NU","VREAU","TE ROG","MA DOARE","SUNT BINE","OBOSIT","SOMN","FRIG","CALD"];
const rows = [["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L","STERGE"],["Z","X","C","V","B","N","M","SPATIU","VORBESTE","GOLESTE"]];
let text = "", cx = window.innerWidth / 2, cy = window.innerHeight / 2, refX = 0.5, refY = 0.5, lastX = 0.5, lastY = 0.5, smoothX = 0.5, smoothY = 0.5, calibrated = false, currentKey = null, hoverStart = 0;
const DWELL_MS = 1150;

function speak(msg) { if (!msg.trim()) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(msg); u.lang = "ro-RO"; u.rate = 0.95; window.speechSynthesis.speak(u); }
function getSuggestions() { const parts = text.split(" "), last = parts[parts.length - 1]; if (!last) return ["SALUT","DA","NU"]; const res = dict.filter(w => w.indexOf(last) === 0 && w !== last).slice(0, 3); for (const def of ["APA","AJUTOR","MULTUMESC"]) { if (res.length < 3 && res.indexOf(def) === -1) res.push(def); } return res; }
function makeKey(label, cls, act) { const d = document.createElement("div"); d.className = "key " + cls; d.textContent = label; d.setAttribute("data-act", act); return d; }
function renderTopRow() { const top = document.getElementById("row-top"); top.innerHTML = ""; top.appendChild(makeKey("CENTREAZA", "calib", "CALIB")); getSuggestions().forEach(s => top.appendChild(makeKey(s, "sug", "SUG:" + s))); }
function buildKeyboard() { renderTopRow(); rows.forEach((r, idx) => { const rowEl = document.getElementById("row-" + (idx + 1)); rowEl.innerHTML = ""; r.forEach(k => { const cls = (k === "VORBESTE" || k === "SPATIU") ? "special" : ((k === "STERGE" || k === "GOLESTE") ? "danger" : ""); rowEl.appendChild(makeKey(k, cls, k)); }); }); }
function triggerAction(act) { if (act === "CALIB") { refX = smoothX; refY = smoothY; cx = window.innerWidth / 2; cy = window.innerHeight / 2; } else if (act.indexOf("SUG:") === 0) { const parts = text.split(" "); parts[parts.length - 1] = act.slice(4); text = parts.join(" ") + " "; renderTopRow(); } else if (act === "SPATIU") { text += " "; renderTopRow(); } else if (act === "STERGE") { text = text.slice(0, -1); renderTopRow(); } else if (act === "GOLESTE") { text = ""; renderTopRow(); } else if (act === "VORBESTE") { speak(text); } else { text += act; renderTopRow(); } document.getElementById("text").textContent = text; }

buildKeyboard();

async function init() {
  const status = document.getElementById("status-bar");
  try {
    const video = document.getElementById("video-bg");
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } }, audio: false });
    video.srcObject = stream;
    await video.play();

    status.textContent = "Incarcare model nas...";
    const vision = await FilesetResolver.forVisionTasks("https://jsdelivr.net");
    const landmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://googleapis.com", delegate: "CPU" },
      runningMode: "VIDEO", numFaces: 1
    });

    status.textContent = "AI Nas Activ";
    const cursorEl = document.getElementById("cursor"), ringEl = document.getElementById("ring"), noseEl = document.getElementById("nose-dot");
    let lastTime = -1;

    function loop() {
      if (video.readyState >= 2 && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        const res = landmarker.detectForVideo(video, performance.now());
        if (res.faceLandmarks && res.faceLandmarks.length > 0) {
          const face = res.faceLandmarks.at(0);
          const nose = face.at(1);
          const nx = 1 - nose.x;
          const ny = nose.y;

          noseEl.style.left = (nx * window.innerWidth) + "px";
          noseEl.style.top = (ny * window.innerHeight) + "px";

          if (!calibrated) { refX = nx; refY = ny; smoothX = nx; smoothY = ny; calibrated = true; }
          smoothX = smoothX * 0.72 + nx * 0.28;
          smoothY = smoothY * 0.72 + ny * 0.28;

          const tx = Math.max(15, Math.min(window.innerWidth - 15, ((smoothX - refX) * 6.5 + 0.5) * window.innerWidth));
          const ty = Math.max(15, Math.min(window.innerHeight - 15, ((smoothY - refY) * 8.0 + 0.5) * window.innerHeight));

          if (Math.abs(tx - cx) > 10) cx += (tx - cx) * 0.25;
          if (Math.abs(ty - cy) > 10) cy += (ty - cy) * 0.25;
        }
      }

      cursorEl.style.left = cx + "px"; cursorEl.style.top = cy + "px";
      ringEl.style.left = cx + "px"; ringEl.style.top = cy + "px";

      let hit = null;
      document.querySelectorAll(".key").forEach(el => {
        const r = el.getBoundingClientRect();
        if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) { el.classList.add("active"); hit = el.getAttribute("data-act"); }
        else el.classList.remove("active");
      });

      const now = performance.now();
      if (hit) {
        if (hit !== currentKey) { currentKey = hit; hoverStart = now; }
        else {
          const prog = Math.min(1, (now - hoverStart) / DWELL_MS);
          ringEl.style.borderColor = "#00e6ff";
          ringEl.style.transform = `translate(-50%, -50%) scale(${1.3 - prog * 0.6})`;
          if (prog >= 1) { triggerAction(hit); hoverStart = now + 700; }
        }
      } else { currentKey = null; ringEl.style.borderColor = "transparent"; }

      requestAnimationFrame(loop);
    }
    loop();
  } catch (e) {
    status.textContent = "Eroare: " + e.message;
  }
}
init();
</script>
</body>
</html>
