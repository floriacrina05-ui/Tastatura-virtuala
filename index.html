<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tastatura Virtuala CV</title>
<script src="https://jsdelivr.net" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #12141a; color: white; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.28; z-index: 0; }
  #ui { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; padding: 8px; gap: 6px; }
  #display { background: #232630; border: 2px solid #00dcb4; border-radius: 10px; padding: 10px; font-size: 22px; min-height: 54px; display: flex; align-items: center; word-break: break-all; }
  .row { display: flex; gap: 4px; flex: 1; justify-content: center; }
  .key { background: #3c414b; border: 1px solid #788296; border-radius: 8px; flex: 1; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; text-align: center; user-select: none; }
  .key.active { background: #00aa55; border-color: #ffffff; transform: scale(1.04); }
  .key.special { background: #006eb4; flex: 1.6; font-size: 12px; }
  .key.danger { background: #963232; flex: 1.6; font-size: 12px; }
  .key.calib { background: #825014; flex: 1.6; font-size: 11px; }
  .key.sug { background: #2d556e; flex: 1.5; font-size: 12px; }
  #cursor { position: fixed; width: 24px; height: 24px; border-radius: 50%; background: rgba(0, 255, 180, 0.95); border: 2px solid white; pointer-events: none; z-index: 10; transform: translate(-50%, -50%); }
  #ring { position: fixed; width: 50px; height: 50px; border-radius: 50%; border: 4px solid transparent; pointer-events: none; z-index: 9; transform: translate(-50%, -50%); }
  #start-overlay { position: fixed; inset: 0; background: rgba(18, 20, 26, 0.95); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; text-align: center; }
  #start-btn { background: #00dcb4; color: #12141a; border: none; padding: 18px 34px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; }
  #status-bar { position: fixed; top: 4px; right: 10px; font-size: 11px; color: #00dcb4; z-index: 15; }
</style>
</head>
<body>
<video id="video-bg" autoplay playsinline muted></video>
<div id="cursor"></div>
<div id="ring"></div>
<div id="status-bar"></div>

<div id="start-overlay">
  <h2>Tastatura Virtuala CV</h2>
  <p style="color:#aaa; max-width:320px;">Controleaza tastatura exclusiv prin miscarea capului. Apasa butonul de mai jos pentru a porni camera.</p>
  <button id="start-btn" onclick="pornesteTot()">PORNESTE APLICATIA</button>
</div>

<div id="ui">
  <div id="display"><span id="text"></span><span style="color:#00dcb4">|</span></div>
  <div class="row" id="row-top"></div>
  <div class="row" id="row-1"></div>
  <div class="row" id="row-2"></div>
  <div class="row" id="row-3"></div>
</div>

<script>
const dict = ["SALUT", "BUNA", "MULTUMESC", "AJUTOR", "APA", "MANCARE", "DA", "NU", "VREAU", "TE ROG", "MA DOARE", "SUNT BINE", "OBOSIT", "SOMN", "FRIG", "CALD"];
const rows = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L","STERGE"],
  ["Z","X","C","V","B","N","M","SPATIU","VORBESTE","GOLESTE"]
];

let text = "";
let cx = window.innerWidth / 2, cy = window.innerHeight / 2;
let refX = 0.5, refY = 0.5, lastNoseX = 0.5, lastNoseY = 0.5;
let currentKey = null, hoverStart = 0;
const DWELL_MS = 1100;

function speak(msg) {
  if (!msg.trim()) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(msg);
  u.lang = "ro-RO";
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function getSuggestions() {
  const parts = text.split(" ");
  const last = parts.at(-1);
  if (!last) return ["SALUT", "DA", "NU"];
  const matches = dict.filter(w => w.startsWith(last) && w !== last);
  const res = matches.slice(0, 3);
  for (const def of ["APA", "AJUTOR", "MULTUMESC"]) {
    if (res.length < 3 && res.indexOf(def) === -1) res.push(def);
  }
  return res;
}

function makeKey(label, cls, act) {
  const d = document.createElement("div");
  d.className = "key " + cls;
  d.textContent = label;
  d.dataset.act = act;
  return d;
}

function renderTopRow() {
  const top = document.getElementById("row-top");
  top.innerHTML = "";
  top.appendChild(makeKey("CALIBREAZA", "calib", "CALIB"));
  getSuggestions().forEach(s => {
    top.appendChild(makeKey(s, "sug", "SUG:" + s));
  });
}

function buildKeyboard() {
  renderTopRow();
  rows.forEach((r, idx) => {
    const rowEl = document.getElementById("row-" + (idx + 1));
    rowEl.innerHTML = "";
    r.forEach(k => {
      let cls = "";
      if (k === "VORBESTE" || k === "SPATIU") cls = "special";
      if (k === "STERGE" || k === "GOLESTE") cls = "danger";
      rowEl.appendChild(makeKey(k, cls, k));
    });
  });
}

function triggerAction(act) {
  if (act === "CALIB") { refX = lastNoseX; refY = lastNoseY; }
  else if (act.indexOf("SUG:") === 0) {
    const word = act.slice(4);
    const parts = text.split(" ");
    parts.splice(-1, 1, word);
    text = parts.join(" ") + " ";
    renderTopRow();
  }
  else if (act === "SPATIU") { text += " "; renderTopRow(); }
  else if (act === "STERGE") { text = text.slice(0, -1); renderTopRow(); }
  else if (act === "GOLESTE") { text = ""; renderTopRow(); }
  else if (act === "VORBESTE") { speak(text); }
  else { text += act; renderTopRow(); }
  document.getElementById("text").textContent = text;
}

buildKeyboard();

async function pornesteTot() {
  document.getElementById("start-overlay").style.display = "none";
  const status = document.getElementById("status-bar");
  status.textContent = "Se porneste camera...";

  try {
    const video = document.getElementById("video-bg");
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    video.srcObject = stream;
    await video.play();

    if (typeof FaceMesh === "undefined") {
      status.textContent = "Eroare incarcare AI";
      return;
    }

    status.textContent = "Se incarca AI...";
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://jsdelivr.net{file}`
    });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults((results) => {
      status.textContent = "Urmarire Cap Activa";
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks.at(0);
        const nose = landmarks.at(1);
        lastNoseX = 1 - nose.x;
        lastNoseY = nose.y;
        const tx = Math.max(15, Math.min(window.innerWidth - 15, ((lastNoseX - refX) * 4.2 + 0.5) * window.innerWidth));
        const ty = Math.max(15, Math.min(window.innerHeight - 15, ((lastNoseY - refY) * 4.6 + 0.5) * window.innerHeight));
        if (Math.abs(tx - cx) > 6) cx += (tx - cx) * 0.25;
        if (Math.abs(ty - cy) > 6) cy += (ty - cy) * 0.25;
      }
    });

    const cursorEl = document.getElementById("cursor");
    const ringEl = document.getElementById("ring");

    async function proceseazaCadru() {
      if (video.readyState >= 2) {
        await faceMesh.send({ image: video });
      }
      cursorEl.style.left = cx + "px"; cursorEl.style.top = cy + "px";
      ringEl.style.left = cx + "px"; ringEl.style.top = cy + "px";

      let hit = null;
      document.querySelectorAll(".key").forEach(el => {
        const r = el.getBoundingClientRect();
        if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
          el.classList.add("active");
          hit = el.dataset.act;
        } else {
          el.classList.remove("active");
        }
      });

      const now = performance.now();
      if (hit) {
        if (hit !== currentKey) { currentKey = hit; hoverStart = now; }
        else {
          const prog = Math.min(1, (now - hoverStart) / DWELL_MS);
          ringEl.style.borderColor = "#00e6ff";
          ringEl.style.transform = `translate(-50%, -50%) scale(${1.3 - prog * 0.6})`;
          if (prog >= 1) {
            triggerAction(hit);
            hoverStart = now + 600;
          }
        }
      } else {
        currentKey = null;
        ringEl.style.borderColor = "transparent";
      }
      requestAnimationFrame(proceseazaCadru);
    }
    proceseazaCadru();
  } catch (e) {
    status.textContent = "Eroare camera: " + e.message;
  }
}
</script>
</body>
</html>
