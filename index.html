<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tastatura CV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#11141c;color:#fff;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.3;z-index:0}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:8px;gap:6px}
#box{background:#1e222d;border:2px solid #00dcb4;border-radius:10px;padding:12px;font-size:24px;min-height:56px;display:flex;align-items:center}
.r{display:flex;gap:4px;flex:1}
.k{background:#373e4b;border:1px solid #788296;border-radius:8px;flex:1;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
.k.on{background:#00b862;border:2px solid #fff;transform:scale(1.04)}
.sp{background:#006eb4;flex:1.6;font-size:12px}
.dl{background:#9e2a2b;flex:1.6;font-size:12px}
.cb{background:#9c6615;flex:1.6;font-size:11px}
#cur{position:fixed;width:26px;height:26px;border-radius:50%;background:#00ffb4;border:3px solid #fff;pointer-events:none;z-index:10;transform:translate(-50%,-50%)}
#prg{position:fixed;width:54px;height:54px;border-radius:50%;border:4px solid transparent;pointer-events:none;z-index:9;transform:translate(-50%,-50%)}
#st{position:fixed;top:4px;right:10px;font-size:11px;color:#00dcb4;z-index:20}
</style>
</head>
<body>
<video id="vid" autoplay playsinline muted></video>
<canvas id="cnv" width="64" height="48" style="display:none"></canvas>
<div id="cur"></div><div id="prg"></div><div id="st">Pornire...</div>
<div id="app">
<div id="box"><span id="txt"></span><span style="color:#00dcb4">|</span></div>
<div class="r"><div class="k cb" data-v="CALIB">CENTREAZA</div><div class="k sp" data-v="SALUT ">SALUT</div><div class="k sp" data-v="AJUTOR ">AJUTOR</div><div class="k sp" data-v="APA ">APA</div><div class="k sp" data-v="DA ">DA</div><div class="k sp" data-v="NU ">NU</div></div>
<div class="r"><div class="k" data-v="Q">Q</div><div class="k" data-v="W">W</div><div class="k" data-v="E">E</div><div class="k" data-v="R">R</div><div class="k" data-v="T">T</div><div class="k" data-v="Y">Y</div><div class="k" data-v="U">U</div><div class="k" data-v="I">I</div><div class="k" data-v="O">O</div><div class="k" data-v="P">P</div></div>
<div class="r"><div class="k" data-v="A">A</div><div class="k" data-v="S">S</div><div class="k" data-v="D">D</div><div class="k" data-v="F">F</div><div class="k" data-v="G">G</div><div class="k" data-v="H">H</div><div class="k" data-v="J">J</div><div class="k" data-v="K">K</div><div class="k" data-v="L">L</div><div class="k dl" data-v="DEL">STERGE</div></div>
<div class="r"><div class="k" data-v="Z">Z</div><div class="k" data-v="X">X</div><div class="k" data-v="C">C</div><div class="k" data-v="V">V</div><div class="k" data-v="B">B</div><div class="k" data-v="N">N</div><div class="k" data-v="M">M</div><div class="k sp" data-v=" ">SPATIU</div><div class="k sp" data-v="SPK">VORBESTE</div><div class="k dl" data-v="CLR">GOLESTE</div></div>
</div>
<script>
var txt="",cx=innerWidth/2,cy=innerHeight/2,rx=.5,ry=.5,sx=.5,sy=.5,cal=false,lastK=null,t0=0;
function speak(m){if(!m.trim()||!('speechSynthesis' in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(m);u.lang="ro-RO";speechSynthesis.speak(u)}
function act(v){if(v==="CALIB"){rx=sx;ry=sy;cx=innerWidth/2;cy=innerHeight/2}else if(v==="DEL")txt=txt.slice(0,-1);else if(v==="CLR")txt="";else if(v==="SPK")speak(txt);else txt+=v;document.getElementById("txt").textContent=txt}
navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:320},height:{ideal:240}},audio:false}).then(function(s){
var vid=document.getElementById("vid");vid.srcObject=s;vid.play();
var cnv=document.getElementById("cnv"),ctx=cnv.getContext("2d",{willReadFrequently:true}),cur=document.getElementById("cur"),prg=document.getElementById("prg");
var esteMobil=innerHeight>innerWidth;
document.getElementById("st").textContent=esteMobil?"Mod Telefon Activ":"Mod Laptop Activ";
function loop(){
if(vid.readyState>=2){ctx.drawImage(vid,0,0,64,48);var d=ctx.getImageData(0,0,64,48).data,sumX=0,sumY=0,cnt=0;for(var y=6;y<42;y++){for(var x=4;x<60;x++){var i=(y*64+x)*4,r=d[i],g=d[i+1],b=d[i+2],cb=128-.1687*r-.3313*g+.5*b,cr=128+.5*r-.4187*g-.0813*b;if(r>65&&cr>=135&&cr<=172&&cb>=78&&cb<=126){sumX+=(64-x);sumY+=y;cnt++}}}if(cnt>10){var nx=(sumX/cnt)/64,ny=(sumY/cnt)/48;if(!cal){rx=nx;ry=ny;sx=nx;sy=ny;cal=true}sx=sx*.78+nx*.22;sy=sy*.78+ny*.22;var multX=esteMobil?11.5:7.5,multY=esteMobil?6.5:8.5,dead=esteMobil?8:14;var tx=Math.max(15,Math.min(innerWidth-15,((sx-rx)*multX+.5)*innerWidth)),ty=Math.max(15,Math.min(innerHeight-15,((sy-ry)*multY+.5)*innerHeight));if(Math.abs(tx-cx)>dead)cx+=(tx-cx)*.22;if(Math.abs(ty-cy)>dead)cy+=(ty-cy)*.22}}
cur.style.left=cx+"px";cur.style.top=cy+"px";prg.style.left=cx+"px";prg.style.top=cy+"px";
var hit=null,ks=document.querySelectorAll(".k");for(var j=0;j<ks.length;j++){var r=ks[j].getBoundingClientRect();if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom){ks[j].classList.add("on");hit=ks[j].getAttribute("data-v")}else ks[j].classList.remove("on")}
var now=performance.now();if(hit){if(hit!==lastK){lastK=hit;t0=now}else{var p=Math.min(1,(now-t0)/1150);prg.style.borderColor="#00e6ff";prg.style.transform="translate(-50%,-50%) scale("+(1.3-p*.6)+")";if(p>=1){act(hit);t0=now+700}}}else{lastK=null;prg.style.borderColor="transparent"}
requestAnimationFrame(loop)}loop()}).catch(function(){document.getElementById("st").textContent="Permite camera"});
</script>
</body>
</html>
